<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompiuterija - Anketa</title>
    <link rel="stylesheet" type="text/css" href="stilius.css">
</head>
<body>
<div id="page">
    <header>
        <h1>Anketa</h1>
        <p class="subheader">Kompiuterio naudojimo įpročiai</p>
    </header>

    <nav id="menu">
        <ul>
            <li><a href="index.html">Pagrindinis</a></li>
            <li><a href="apiemus.html">Apie mus</a></li>
            <li><a href="komponentai.html">Komponentai</a></li>
            <li><a href="galerija.html">Galerija</a></li>
            <li><a href="anketa.html">Anketa</a></li>
        </ul>
    </nav>

    <main id="content">
        <aside id = "aside">
            <p>Duomenys neskelbiami ir nerenkami</p>
        </aside>

        <article>
            <h2>Anketa</h2>
            <form action="#" method="get">
                <label for="vardas">Vardas:</label>
                <input type="text" id="vardas" name="vardas" required>

                <label for="pastas">El. paštas:</label>
                <input type="email" id="pastas" name="pastas" required>

                <label for="amzius">Amžius:</label>
                <input type="number" id="amzius" name="amzius" min="1" max="120">

                <label for="platforma">Kokį kompiuteri naudoji?</label>
                <select id="platforma" name="platforma">
                    <option value="stacionarus">Stacionarų kompiuterį</option>
                    <option value="nesiojamas">Nešiojamąjį kompiuterį</option>
                    <option value="abu">Abu</option>
                </select>

                <p>Kam dažniausiai naudoji kompiuterį?</p>
                <label class="choice"><input type="checkbox" name="naudojimas" value="mokslai"> Mokslams</label>
                <label class="choice"><input type="checkbox" name="naudojimas" value="darbas"> Darbui</label>
                <label class="choice"><input type="checkbox" name="naudojimas" value="zaidimai"> Žaidimams</label>
                

                <p>Ar domiesi kompiuterių komponentais?</p>
                <label class="choice"><input type="radio" name="domiuosi" value="taip"> Taip</label>
                <label class="choice"><input type="radio" name="domiuosi" value="ne"> Ne</label>
                
                <p>Kas yra Intel 4004?</p>
                <label class="choice"><input type="radio" name="intel4004" value="procesorius"> Procesorius</label>
                <label class="choice"><input type="radio" name="intel4004" value="atmintis"> Motininė plokštė</label>
                <label class="choice"><input type="radio" name="intel4004" value="kietasisdiskas"> Kietasis diskas</label>

                <label for="data">Anketos pildymo data:</label>
                <input type="date" id="data" name="data">

                <label for="komentaras">Komentaras:</label>
                <textarea id="komentaras" name="komentaras" rows="4"></textarea>

                <button type="submit">Pateikti</button>
                <button type="reset" class="reset">Išvalyti</button>
            </form>
        </article>
    </main>

    <footer>
        <p>2026 EIC. &copy; Visos teisės saugomos.</p>
    </footer>
</div>
</body>
</html>
